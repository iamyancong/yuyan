name: CI / CD Pipeline

on:
  push:
    branches:
      - feat/github-actions-build
      - main
  pull_request:
    branches:
      - feat/github-actions-build
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cache Tauri Linux apt packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-cache
          key: ${{ runner.os }}-tauri-apt-v1

      - name: Install Tauri Linux dependencies
        run: |
          mkdir -p /tmp/apt-cache/partial
          sudo rm -f /var/lib/man-db/auto-update /etc/apt/apt.conf.d/docker-clean
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Dir::Cache::archives="/tmp/apt-cache" \
            -o APT::Keep-Downloaded-Packages="true" \
            -o APT::Sandbox::User="root" \
            -o Acquire::Retries=3 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Test packaging and release scripts
        run: node --test scripts/*.test.js

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Verify frontend, server and MCP
        run: |
          pnpm typecheck
          pnpm test:central-url
          pnpm test:server
          pnpm test:mcp
          pnpm frontend:build:ci

      - name: Prepare Tauri resource directory
        run: |
          mkdir -p src-tauri/resources/bin
          touch src-tauri/resources/bin/placeholder.txt

      - name: Verify Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check
          cargo test
