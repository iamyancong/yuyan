name: Build Tauri App

on:
  push:
    branches:
      - feat/github-actions-build
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  prep-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing repository secret: TAURI_SIGNING_PRIVATE_KEY' >&2
            exit 1
          fi

      - name: Test packaging scripts
        run: >-
          node --test
          scripts/generate-update-manifest.test.js
          scripts/server-production-dependencies.test.js
          scripts/mcp-production-dependencies.test.js

      - name: Calculate Version
        id: calc
        run: node scripts/bump-version.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Verify frontend, server and MCP
        run: |
          pnpm typecheck
          pnpm test:central-url
          pnpm test:server
          pnpm test:mcp
          pnpm frontend:build:ci

      - name: Prepare Tauri resource directory
        run: |
          mkdir -p src-tauri/resources/bin
          touch src-tauri/resources/bin/placeholder.txt

      - name: Verify Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo check
          cargo test

  build:
    needs: [prep-version, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: yuyan-windows-x86_64
            update_target: windows-x86_64
          - platform: macos-15
            artifact: yuyan-macos-aarch64
            update_target: darwin-aarch64
            expected_arch: arm64
          - platform: macos-15-intel
            artifact: yuyan-macos-x86_64
            update_target: darwin-x86_64
            expected_arch: x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Apply Bumped Version
        run: node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}

      - name: Create Env File
        env:
          CENTRAL_URL: ${{ secrets.VITE_APP_SERVER_URL }}
          GITLAB_HOST: ${{ secrets.VITE_GITLAB_HOST }}
        run: |
          node --experimental-strip-types --input-type=module -e "import { assertAllowedCentralUrl } from './src/utils/centralUrlPolicy.ts'; assertAllowedCentralUrl(process.env.CENTRAL_URL || '')"
          printf 'VITE_APP_SERVER_URL=%s\n' "$CENTRAL_URL" > .env
          printf 'VITE_GITLAB_HOST=%s\n' "$GITLAB_HOST" >> .env
        shell: bash

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Build Tauri App
        shell: bash
        env:
          CENTRAL_URL: ${{ secrets.VITE_APP_SERVER_URL }}
          CI: true
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          SCHEME=$(node --input-type=module -e "console.log(new URL(process.env.CENTRAL_URL).protocol.slice(0, -1))")
          HOST=$(node --input-type=module -e "console.log(new URL(process.env.CENTRAL_URL).hostname)")
          PORT=$(node --input-type=module -e "const u = new URL(process.env.CENTRAL_URL); console.log(u.port || (u.protocol === 'https:' ? '443' : '80'))")
          echo "Building with secured central service ($SCHEME, port $PORT)"
          UPDATE_SERVER_SCHEME="$SCHEME" UPDATE_SERVER_HOST="$HOST" UPDATE_SERVER_PORT="$PORT" pnpm run build

      - name: Verify macOS Bundle Architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_BINARY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/MacOS/yuyan-app' -type f -print -quit)
          NODE_BINARY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/Resources/resources/bin/node' -type f -print -quit)
          test -n "$APP_BINARY"
          test -n "$NODE_BINARY"
          file "$APP_BINARY" | tee /tmp/yuyan-app-arch.txt
          file "$NODE_BINARY" | tee /tmp/yuyan-node-arch.txt
          grep -q '${{ matrix.expected_arch }}' /tmp/yuyan-app-arch.txt
          grep -q '${{ matrix.expected_arch }}' /tmp/yuyan-node-arch.txt

      - name: Verify macOS Packaged Gateway
        if: runner.os == 'macOS'
        shell: bash
        run: |
          NODE_BINARY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/Resources/resources/bin/node' -type f -print -quit)
          SERVER_ENTRY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/Resources/_up_/server/index.mjs' -type f -print -quit)
          test -n "$NODE_BINARY"
          test -n "$SERVER_ENTRY"
          node scripts/verify-packaged-server.mjs "$NODE_BINARY" "$SERVER_ENTRY"

      - name: Verify macOS Packaged MCP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          NODE_BINARY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/Resources/resources/bin/node' -type f -print -quit)
          MCP_ENTRY=$(find src-tauri/target/release/bundle/macos -path '*/Contents/Resources/_up_/mcp/dist/index.js' -type f -print -quit)
          test -n "$NODE_BINARY"
          test -n "$MCP_ENTRY"
          node scripts/verify-packaged-mcp.mjs "$NODE_BINARY" "$MCP_ENTRY"

      - name: Prepare Update Artifact
        shell: bash
        run: |
          TARGET_DIR="update-artifact/${{ matrix.update_target }}"
          VERSION="${{ needs.prep-version.outputs.version }}"
          mkdir -p "$TARGET_DIR"
          if [ "${{ runner.os }}" = 'Windows' ]; then
            BUNDLE_FILE=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' -type f -print -quit)
            BUNDLE_NAME="yuyan_${VERSION}_windows-x86_64-installer.exe"
            UPDATER_FILE="$BUNDLE_FILE"
            UPDATE_NAME="yuyan_${VERSION}_windows-x86_64-setup.exe"
          else
            BUNDLE_FILE=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)
            BUNDLE_NAME="yuyan_${VERSION}_${{ matrix.update_target }}.dmg"
            UPDATER_FILE=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
            UPDATE_NAME="yuyan_${VERSION}_${{ matrix.update_target }}.app.tar.gz"
          fi
          test -n "$BUNDLE_FILE"
          test -n "$UPDATER_FILE"
          test -f "${UPDATER_FILE}.sig"
          cp "$BUNDLE_FILE" "$TARGET_DIR/$BUNDLE_NAME"
          cp "$UPDATER_FILE" "$TARGET_DIR/$UPDATE_NAME"
          cp "${UPDATER_FILE}.sig" "$TARGET_DIR/${UPDATE_NAME}.sig"
          cargo run \
            --manifest-path src-tauri/Cargo.toml \
            --example verify_update_signature \
            -- "$TARGET_DIR/$UPDATE_NAME" "$TARGET_DIR/${UPDATE_NAME}.sig"

      - name: Upload Update Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: update-artifact

  release:
    needs: [prep-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-windows-x86_64
          path: ./dist-release

      - name: Download macOS ARM Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-macos-aarch64
          path: ./dist-release

      - name: Download macOS Intel Artifact
        uses: actions/download-artifact@v8
        with:
          name: yuyan-macos-x86_64
          path: ./dist-release

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate signed updater manifest
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: >-
          node scripts/generate-update-manifest.js
          "${{ needs.prep-version.outputs.version }}"
          "${{ needs.prep-version.outputs.tag }}"
          "${{ github.repository }}"
          ./dist-release

      - name: Validate Release Assets
        shell: bash
        run: |
          VERSION="${{ needs.prep-version.outputs.version }}"
          EXPECTED_FILES=(
            "latest.json"
            "yuyan_${VERSION}_windows-x86_64-installer.exe"
            "yuyan_${VERSION}_windows-x86_64-setup.exe"
            "yuyan_${VERSION}_windows-x86_64-setup.exe.sig"
            "yuyan_${VERSION}_darwin-aarch64.dmg"
            "yuyan_${VERSION}_darwin-aarch64.app.tar.gz"
            "yuyan_${VERSION}_darwin-aarch64.app.tar.gz.sig"
            "yuyan_${VERSION}_darwin-x86_64.dmg"
            "yuyan_${VERSION}_darwin-x86_64.app.tar.gz"
            "yuyan_${VERSION}_darwin-x86_64.app.tar.gz.sig"
          )
          ACTUAL_COUNT=$(find ./dist-release -type f | wc -l | tr -d ' ')
          test "$ACTUAL_COUNT" -eq "${#EXPECTED_FILES[@]}"
          for filename in "${EXPECTED_FILES[@]}"; do
            MATCH_COUNT=$(find ./dist-release -type f -name "$filename" | wc -l | tr -d ' ')
            test "$MATCH_COUNT" -eq 1
          done
          find ./dist-release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep-version.outputs.tag }}
          name: yuyan ${{ needs.prep-version.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prep-version.outputs.prerelease == 'true' }}
          body: |
            ${{ github.event.head_commit.message }}
          files: |
            ./dist-release/latest.json
            ./dist-release/**/*.dmg
            ./dist-release/**/*.exe
            ./dist-release/**/*.app.tar.gz
            ./dist-release/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): bump version to ${{ needs.prep-version.outputs.version }} [skip ci]"
            git push origin HEAD:feat/github-actions-build
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
