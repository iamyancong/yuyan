name: Build Tauri App

on:
  push:
    branches:
      - feat/github-actions-build
      - yuyan-3.0
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prep-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate Version
        id: calc
        run: node scripts/bump-version.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prep-version
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Apply Bumped Version
        run: node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Build Tauri App
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Windows Artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS Artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-macos-build
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: [prep-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: yuyan-windows-build
          path: ./dist-release

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: yuyan-macos-build
          path: ./dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep-version.outputs.tag }}
          name: yuyan ${{ needs.prep-version.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prep-version.outputs.prerelease == 'true' }}
          files: |
            ./dist-release/**/*.exe
            ./dist-release/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
