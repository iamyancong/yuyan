name: Build Tauri App

on:
  push:
    branches:
      - feat/github-actions-build
      - yuyan-3.0
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prep-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate Version
        id: calc
        run: node scripts/bump-version.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prep-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: yuyan-windows-x86_64
            update_target: windows-x86_64
            bundle_path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-15
            artifact: yuyan-macos-aarch64
            update_target: darwin-aarch64
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: macos-13
            artifact: yuyan-macos-x86_64
            update_target: darwin-x86_64
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Apply Bumped Version
        run: node scripts/apply-version.js ${{ needs.prep-version.outputs.version }}

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Build Tauri App
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          TAURI_BUNDLER_DMG_IGNORE_CI: true

      - name: Prepare Update Artifact
        shell: bash
        run: |
          mkdir -p "update-artifact/${{ matrix.update_target }}"
          cp ${{ matrix.bundle_path }} "update-artifact/${{ matrix.update_target }}/"

      - name: Upload Update Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: update-artifact

  release:
    needs: [prep-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: yuyan-windows-x86_64
          path: ./dist-release

      - name: Download macOS ARM Artifact
        uses: actions/download-artifact@v4
        with:
          name: yuyan-macos-aarch64
          path: ./dist-release

      - name: Download macOS Intel Artifact
        uses: actions/download-artifact@v4
        with:
          name: yuyan-macos-x86_64
          path: ./dist-release

      - name: Prepare Static Update Release
        run: node scripts/prepare-app-update-release.mjs "${{ needs.prep-version.outputs.version }}" ./dist-release ./app-update-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep-version.outputs.tag }}
          name: yuyan ${{ needs.prep-version.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prep-version.outputs.prerelease == 'true' }}
          files: |
            ./dist-release/**/*.exe
            ./dist-release/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Installers to Internal Static Server
        env:
          APP_UPDATE_SSH_HOST: ${{ secrets.APP_UPDATE_SSH_HOST }}
          APP_UPDATE_SSH_PORT: ${{ secrets.APP_UPDATE_SSH_PORT }}
          APP_UPDATE_SSH_USER: ${{ secrets.APP_UPDATE_SSH_USER }}
          APP_UPDATE_SSH_KEY: ${{ secrets.APP_UPDATE_SSH_KEY }}
          APP_UPDATE_SSH_PATH: ${{ secrets.APP_UPDATE_SSH_PATH }}
        run: |
          if [ -z "$APP_UPDATE_SSH_HOST" ] || [ -z "$APP_UPDATE_SSH_USER" ] || [ -z "$APP_UPDATE_SSH_KEY" ] || [ -z "$APP_UPDATE_SSH_PATH" ]; then
            echo "Internal update server secrets are not configured; skipping static publication."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$APP_UPDATE_SSH_KEY" > ~/.ssh/app-update
          chmod 600 ~/.ssh/app-update
          SSH_PORT="${APP_UPDATE_SSH_PORT:-22}"
          SSH_COMMAND="ssh -i ~/.ssh/app-update -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"
          rsync -az --exclude='manifest.json.next' -e "$SSH_COMMAND" ./app-update-release/ "${APP_UPDATE_SSH_USER}@${APP_UPDATE_SSH_HOST}:${APP_UPDATE_SSH_PATH}/"
          scp -i ~/.ssh/app-update -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new ./app-update-release/stable/manifest.json.next "${APP_UPDATE_SSH_USER}@${APP_UPDATE_SSH_HOST}:${APP_UPDATE_SSH_PATH}/stable/manifest.json.next"
          $SSH_COMMAND "${APP_UPDATE_SSH_USER}@${APP_UPDATE_SSH_HOST}" "mv '${APP_UPDATE_SSH_PATH}/stable/manifest.json.next' '${APP_UPDATE_SSH_PATH}/stable/manifest.json'"
