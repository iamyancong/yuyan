name: Build Tauri App

on:
  push:
    branches:
      - feat/github-actions-build
      - yuyan-3.0
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pnpm
        run: npm install -g pnpm@9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Build Tauri App
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Windows Artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS Artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-macos-build
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: yuyan-windows-build
          path: ./dist-release

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: yuyan-macos-build
          path: ./dist-release

      - name: Display structure of downloaded files
        run: ls -R ./dist-release

      - name: Generate Tag & Release Name
        id: prep
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="yuyan ${TAG_NAME}"
            DRAFT="false"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_NAME="v${VERSION}-${SHORT_SHA}"
            RELEASE_NAME="yuyan v${VERSION} (${SHORT_SHA})"
            DRAFT="true"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "draft=${DRAFT}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: ${{ steps.prep.outputs.release_name }}
          draft: ${{ steps.prep.outputs.draft == 'true' }}
          prerelease: false
          files: |
            ./dist-release/**/*.exe
            ./dist-release/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
