[package]
name = "yuyan-app"
version = "1.3.24"
edition = "2021"

[lib]
name = "yuyan_app_lib"
crate-type = ["rlib"] # 桌面端运行与打包仅需 rlib；移除 staticlib 避免开发过程额外生成 ~500MB 的静态归档库（libyuyan_app_lib.a）

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["default", "image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "time"] }
sha2 = "0.10"
fs2 = "0.4"
base64 = "0.22"
minisign-verify = "0.2.5"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.25.0"
aes-gcm = "0.10"

[profile.dev]
# 本地日常开发仅保留行号调用栈（崩溃 panic 时仍可精确定位源码行），去除冗余 AST 与局部变量调试符号
debug = "line-tables-only"
# macOS 下开启符号分离，避免调试符号内联到每个对象文件中造成构建缓存无限膨胀
split-debuginfo = "unpacked"

# 针对所有第三方依赖库彻底关闭调试符号（体积骤降 80% 的核心配置，避免 target 目录堆积数十 GB）
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"       # 针对二进制文件体积进行极致优化（体积小可以大幅提升启动速度和减少磁盘占用）
lto = true            # 开启全局链接时优化 (Link Time Optimization)
codegen-units = 1     # 限制编译单元为 1，生成更高效的机器码，且体积更小
panic = "abort"       # 发生 panic 时直接中止进程而不展开调用栈，显著减小体积
strip = true          # 自动剥离符号表与调试信息，大幅压缩最终发布的包体积
